<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>timersuspend</title>
<style>body{margin:0}iframe{border:0;position:absolute;left:0;top:0;width:375px;height:900px;visibility:hidden}
pre{position:relative;z-index:9;font:12px/1.5 monospace}</style>
</head><body>
<pre id="out">pending</pre>
<iframe id="f" src="../pinyin-nine-key.html"></iframe>
<script>
/* 验「页面被挂起时那段时间不算进练习时长」
   ------------------------------------------------------------------
   场景：笔记本合盖 / 系统休眠 / 后台被节流。此时 `visibilitychange` **不触发**
   （页面在浏览器眼里一直"可见"），所以只能靠心跳自己发现。
   不处理的话：合上盖子过一夜，第二天打开会平白多出十几个小时。

   怎么造出这个场景：只把 iframe 里的 `Date.now()` 换成一个可控的钟
   （`w.Date.now`），然后让钟一次往前跳 3600 秒 —— 心跳照跑，但"经过的时间"是一小时。

   ⚠️ 必须断言"钟真的跳了"，否则覆写没生效时这个测试会**空转着通过**。
   ⚠️ 老版本跑这个页面**应当 FAIL**（显示会跳到 1:00:xx）；能 FAIL 才说明它咬得住。

   用法：python _check/run_check.py timersuspend.html */
var problems = [], log = [];
function ok(c, m) { if (!c) problems.push(m); }
function finish() {
  document.getElementById('out').textContent =
    JSON.stringify({ ok: problems.length === 0, problems: problems, log: log }, null, 1);
  document.title = problems.length ? 'FAIL' : 'PASS';
}
function secs(txt) {
  var m = /(\d+):(\d\d)(?::(\d\d))?$/.exec(txt || '');
  if (!m) return null;
  return m[3] ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : (+m[1]) * 60 + (+m[2]);
}

var f = document.getElementById('f');
f.addEventListener('load', function () {
  var w = f.contentWindow, d = f.contentDocument;
  var KEY = 'ninekey-page-seconds';
  var realNow = Date.now.bind(Date);
  var offset = 0;
  w.Date.now = function () { return realNow() + offset; };   // 只换 iframe 的钟

  function shown() { return d.getElementById('pageTimer').textContent; }
  function store() {
    try { return JSON.parse(w.localStorage.getItem(KEY)) || {}; } catch (e) { return null; }
  }
  function basic() { return ((store() || {}).basic) || 0; }

  var D1, S1;
  setTimeout(function () {                       // ① 先正常跑 1.3 秒
    D1 = secs(shown()); S1 = basic();
    ok(Math.abs(w.Date.now() - realNow()) < 1500,
       '覆写的钟没生效（偏差 ' + Math.round(w.Date.now() - realNow()) + 'ms）——下面的断言会变成空转');
    ok(D1 !== null && D1 >= 1, '正常运行时没在计时：' + shown());
    log.push('t1 正常跑 1.3 秒：显示 ' + shown() + '，存档 basic=' + S1.toFixed(2));

    offset += 3600 * 1000;                       // ② 合上盖子，"过了一小时"
    setTimeout(function () {                     // ③ 等心跳跳过一次
      var D2 = secs(shown()), S2 = basic();
      var jumped = w.Date.now() - realNow();
      ok(jumped > 3000000,
         '这一小时的跳跃没真的发生（只跳了 ' + Math.round(jumped / 1000) + ' 秒）——测试是空转的');
      ok(D2 !== null && D2 < 10,
         '挂起的那一小时被算进显示了：' + shown() + '（应当还是几秒）');
      ok(S2 - S1 < 10,
         '挂起的那一小时被写进存档了：basic ' + S1.toFixed(2) + ' → ' + S2.toFixed(2));
      log.push('t2 钟跳 3600 秒、心跳过后：显示 ' + shown() +
               '，存档 basic=' + S2.toFixed(2) + '（只该多 1 秒多）');

      /* ④ 跳完之后还得能继续正常计时（别修成"再也不走了"）。
         等 2.2 秒 —— 按秒取整 + 刷新相位的关系，等待必须 ≥2 秒才保证看得出来。 */
      setTimeout(function () {
        var D3 = secs(shown());
        ok(D3 > D2, '跳过之后不走了：' + D2 + ' → ' + D3);
        log.push('t3 再跑 2.2 秒：显示 ' + shown());
        finish();
      }, 2200);
    }, 1300);
  }, 1300);
});
</script>
</body></html>
