<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>移动端自动播放策略复现</title>
<style>body{margin:8px;background:#c9d4e4;font:13px/1.5 monospace}
iframe{width:375px;height:640px;border:0;display:block;margin:0 auto;background:#fff}
pre{background:#fff;padding:8px;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" src="../pinyin-nine-key.html"></iframe>
<pre id="out">running…</pre>
<script>
/* ---------------------------------------------------------------
   复现「第二个字点完就不发音」：

   移动端浏览器（iOS Safari / Android Chrome）的媒体自动播放策略是
   **元素级 + 用户手势** 的：某个 <audio> 元素必须在用户手势的同步调用栈里
   成功 play() 过一次才算“解锁”，之后才允许在异步回调里换 src 继续播。
   而 demo/practice 的拼读链是 voiceSeq 串起来的 —— 只有**第一项**在手势栈内，
   第 2 项起都在 onended 回调里。原代码每次 new Audio() → 每一项都是新元素
   → 第 2 项起一律被拒。

   这里把 Audio 换成“遵守这条规则”的假实现，手点击键时置 __gesture，
   就能在 headless 里稳定复现/验收。
   --------------------------------------------------------------- */
var OUT = document.getElementById('out');
var LINES = [], bad = [], win = null, d = null;
var LOG = { plays: [], rejects: [], errors: [] };
var LAYOUT = [1, 2, 3, 4, 5, 6, 7, 8, 9, '*', 0, '#'];

function log(s) { LINES.push(s); OUT.textContent = LINES.join('\n'); }
function chk(c, m) { if (!c) bad.push(m); }
function short(u) { return String(u).split('/').pop(); }

var f = document.getElementById('f');
f.onload = function () { run(); };

function stage(name, fn) {
  try { fn(); }
  catch (e) { bad.push('[' + name + '] 抛异常: ' + e.message); log('❌ ' + name + ' 抛异常: ' + e.message); }
}

function run() {
  stage('inject', function () {
    win = f.contentWindow;
    d = f.contentDocument;
    win.__gesture = false;

    /* --- 假 Audio：模拟“元素级解锁 + 必须用户手势” --- */
    win.Audio = function () {
      var self = this;
      this.playbackRate = 1; this.preload = ''; this._src = ''; this._unlocked = false;
      this.onended = null; this.onerror = null;
      Object.defineProperty(this, 'src', {
        get: function () { return self._src; },
        set: function (v) { self._src = v; }
      });
      this.load = function () {};
      this.pause = function () { self._paused = true; };
      this.play = function () {
        self._paused = false;
        if (!self._unlocked && !win.__gesture) {
          LOG.rejects.push(short(self._src));
          var e = new Error("play() failed because the user didn't interact with the document first");
          e.name = 'NotAllowedError';
          return Promise.reject(e);
        }
        self._unlocked = true;
        LOG.plays.push(short(self._src));
        return Promise.resolve().then(function () {
          if (self._paused) return;
          if (self.onended) self.onended();
        });
      };
    };

    /* --- 假 TTS：否则真语音引擎在 headless 里要等 2600ms 兜底 --- */
    win.speechSynthesis = {
      speak: function (u) { setTimeout(function () { if (u.onend) u.onend(); }, 10); },
      cancel: function () {},
      getVoices: function () { return [{ name: 'fake-zh', lang: 'zh-CN' }]; }
    };
    win.SpeechSynthesisUtterance = function (t) { this.text = t; this.lang = ''; this.rate = 1; this.onend = null; this.onerror = null; };
  });

  var letters, digits, word, i = 0;

  /* 所有"用户点击"都要带手势标志 —— 包括切 tab：
     真实用户点 tab 也是一次手势，解锁那一下正是挂在它上面的。 */
  function tap(el) {
    win.__gesture = true;
    try { el.click(); } finally { win.__gesture = false; }
  }

  stage('read', function () {
    tap(d.querySelector('.tab[data-page="practice"]'));
    word = win.eval('pracWord.hanzi');
    letters = String(win.eval('pracWord.letters')).split('');   // letters 是字符串，不是数组
    digits = JSON.parse(win.eval('JSON.stringify(String(pracWord.letters).split("").map(function(c){return LETTER_DIGIT[c];}))'));
    log('词 = ' + word + '（' + win.eval('pracWord.pinyin') + '）  字母=' + letters.join(',') + '  该按=' + digits.join(','));
  });

  /* 逐键点击：每次点击都是一个新的“用户手势”，并在点击期间置 __gesture */
  function tapNext() {
    if (i >= digits.length) { setTimeout(finish, 6000); return; }
    var btn = d.getElementById('padPractice').querySelectorAll('button.k')[LAYOUT.indexOf(Number(digits[i]))];
    if (!btn) { bad.push('找不到键 ' + digits[i]); finish(); return; }
    tap(btn);
    i++;
    setTimeout(tapNext, 700);
  }
  setTimeout(tapNext, 300);

  function finish() {
    var audioBad = {}, seq = [];
    try { audioBad = JSON.parse(win.eval('JSON.stringify(audioBad)')); } catch (e) {}
    log('');
    log('成功播放（按顺序）: ' + (LOG.plays.length ? LOG.plays.join(' ') : '（无）'));
    log('被策略拒绝        : ' + (LOG.rejects.length ? LOG.rejects.join(' ') : '（无）'));
    log('被永久拉黑的音频  : ' + (Object.keys(audioBad).length ? Object.keys(audioBad).join(' ') : '（无）'));

    chk(LOG.plays.length > 0, '一次都没播成功，测试本身没跑起来');
    chk(LOG.rejects.length === 0, '有 ' + LOG.rejects.length + ' 次播放被自动播放策略拒绝: ' + LOG.rejects.join(' '));
    chk(Object.keys(audioBad).length === 0, '有音频被误判为“源坏了”永久拉黑: ' + Object.keys(audioBad).join(' '));
    log('');
    log(bad.length ? '❌ FAIL\n' + bad.join('\n') : '✅ PASS —— 拼读链每一步都播成功了');
  }
}
</script></body></html>
